name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  GRADLE_VERSION: "9.3.1"   # 👈 AGP 9.1.1 exige Gradle >= 9.3.1 (dito pelo próprio erro)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          if [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Diagnostico do projeto
        run: |
          echo "--- gradlew? ---"; ls -la gradlew || echo "sem gradlew"
          echo "--- wrapper? ---"; ls -la gradle/wrapper/ || echo "sem wrapper"
          echo "--- versoes (libs.versions.toml) ---"
          grep -n -E "agp|kotlin|gradle" gradle/libs.versions.toml || true
          echo "--- compileSdk / toolchain ---"
          grep -n -E "compileSdk|jvmToolchain|JavaVersion|buildTools" app/build.gradle.kts || true

      - name: Preparar Gradle
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          elif [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "usando wrapper jar direto"
          else
            gradle wrapper --gradle-version "$GRADLE_VERSION"
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            java -cp gradle/wrapper/gradle-wrapper.jar \
              org.gradle.wrapper.GradleWrapperMain assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BlazerGateway-debug-apk
          path: app/build/outputs/apk/debug/*.apk
